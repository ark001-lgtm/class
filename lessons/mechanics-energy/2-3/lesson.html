<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>열역학 제1법칙 수업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 전자칠판 수업 화면 : 1920×1080 무대를 화면 크기에 맞춰 키우고 줄인다.
   실험실 계기판 느낌 : 차가운 회색 바탕, 흰 판, 모눈 그래프.
   열 Q · 일 W · 내부 에너지 ΔU 는 어느 화면에서나 같은 색을 쓴다. */
:root {
  --bg: #E8EDF1;
  --panel: #FFFFFF;
  --panel-2: #F2F5F8;
  --ink: #132232;
  --ink-2: #344A60;
  --muted: #5B6D80;
  --line: #C9D3DC;
  --grid: #E0E7ED;
  --heat: #D4461C;
  --work: #0B8770;
  --energy: #5A43C6;
  --cold: #236FC6;
  --good: #1D8247;
  --pen: #C21D4E;
  --f-sans: "IBM Plex Sans KR", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D141B; --panel: #16212B; --panel-2: #1C2834; --ink: #E6EDF3; --ink-2: #C0CEDA; --muted: #8FA1B2;
    --line: #2E3D4B; --grid: #1F2C38; --heat: #FF7650; --work: #2EC6A5; --energy: #A090F7; --cold: #5BA4F6;
    --good: #4FC47F; --pen: #FF6F96; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D141B; --panel: #16212B; --panel-2: #1C2834; --ink: #E6EDF3; --ink-2: #C0CEDA; --muted: #8FA1B2;
  --line: #2E3D4B; --grid: #1F2C38; --heat: #FF7650; --work: #2EC6A5; --energy: #A090F7; --cold: #5BA4F6;
  --good: #4FC47F; --pen: #FF6F96; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
p { margin: 0; }
#frame {
  position: fixed; inset: 0;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0;
  display: grid; grid-template-rows: 104px minmax(0, 1fr); background: var(--bg); overflow: hidden;
  font-size: 28px; line-height: 1.5; word-break: keep-all; overflow-wrap: break-word;
  /* 펜·손가락으로 쓸 때 화면이 끌리거나 확대되거나 글자가 선택되지 않게 */
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font-family: inherit; }
:focus-visible { outline: 4px solid var(--cold); outline-offset: 3px; }

/* ── 머리줄 : 제목 · 필기 도구 · 넘기기 ── */
.bar { display: flex; align-items: center; gap: 18px; padding: 0 28px; background: var(--panel); border-bottom: 2px solid var(--line); }
.bar-left { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1 1 auto; }
.bar-right { display: flex; align-items: center; gap: 12px; flex: none; }
.titles { min-width: 0; overflow: hidden; }
.kicker { display: flex; align-items: center; gap: 10px; font-size: 22px; color: var(--muted); letter-spacing: .02em; white-space: nowrap; min-width: 0; }
.kicker #kicker { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.kicker .ws-chip { flex: none; }
.bar h1 { margin: 0; font-size: 40px; line-height: 1.2; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-chip { font-size: 20px; font-weight: 600; line-height: 1.3; color: var(--ink-2); background: var(--panel-2); border: 2px solid var(--line); border-radius: 999px; padding: 1px 12px; white-space: nowrap; }
.count { font: 600 22px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 필기 도구 · 화면 크기(확대 · 축소 · 전체 화면) */
.pen-tools, .view-tools { flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--panel-2); border: 2px solid var(--line); border-radius: 16px; }
.tool.zoom-val { min-width: 84px; font: 700 22px var(--f-mono); font-variant-numeric: tabular-nums; }
.tool.zoom-val[aria-pressed="true"] { background: var(--panel); border-color: var(--ink); }
.tool:disabled { opacity: .35; cursor: default; }
#btn-full .fs-out { display: none; }
#btn-full[aria-pressed="true"] .fs-in { display: none; }
#btn-full[aria-pressed="true"] .fs-out { display: inline; }
.tool { height: 62px; min-width: 56px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 2px solid transparent; border-radius: 12px; background: transparent; color: var(--ink); font-size: 24px; font-weight: 700; white-space: nowrap; cursor: pointer; touch-action: manipulation; }
.tool svg { width: 32px; height: 32px; flex: none; }
.tool:hover { border-color: var(--line); }
.tool.toggle[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tool.pick[aria-pressed="true"] { background: var(--panel); border-color: var(--ink); }
.tool.sw { min-width: 50px; padding: 0; }
.tool.sw i { display: block; width: 30px; height: 30px; border-radius: 50%; }
.tool.sw.hl i { width: 36px; height: 16px; border-radius: 4px; transform: rotate(-24deg); }
.btn.icon { width: 64px; padding: 0; }
.btn.icon svg { width: 32px; height: 32px; }

/* 수업 화면(#view) : 머리줄 아래. 확대는 안쪽 #zoom 에만 걸어 머리줄은 그대로 둔다 */
#view { position: relative; overflow: hidden; min-height: 0; }
#zoom { position: absolute; left: 0; top: 0; width: 1920px; height: 976px; transform-origin: 0 0; }
#stage.zoomed #view { cursor: grab; }
#stage.panning #view, #stage.panning #view * { cursor: grabbing !important; }
/* 잠깐 뜨는 안내 */
#toast { position: absolute; left: 50%; top: 120px; transform: translateX(-50%); z-index: 30; max-width: 1180px; padding: 18px 28px; border-radius: 16px;
  background: var(--ink); color: var(--panel); font-size: 26px; line-height: 1.55; box-shadow: 0 10px 30px rgba(0,0,0,.25); cursor: pointer; }
#toast b { font-weight: 700; }
/* 필기 층 : 수업 화면 위에 겹친다. 입력은 무대(#stage)에서 받는다 */
#ink-wrap { position: absolute; left: 0; top: 0; width: 1920px; height: 976px; pointer-events: none; z-index: 5; }
#ink-wrap > canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
#board { position: absolute; inset: 0; pointer-events: auto; cursor: crosshair; background-color: var(--panel);
  background-image: linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px); background-size: 60px 60px; background-position: -1px -1px; }
#board .board-note { position: absolute; left: 32px; top: 16px; font-size: 22px; color: var(--muted); background: var(--panel); padding: 2px 8px; border-radius: 6px; }
body.hand-on #scene { cursor: crosshair; }

.btn { font-size: 26px; font-weight: 600; line-height: 1.2; padding: 14px 24px; min-height: 64px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; white-space: nowrap; touch-action: manipulation; }
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.small { font-size: 22px; min-height: 52px; padding: 8px 18px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }

#scene { position: relative; height: 100%; padding: 24px 32px 28px; overflow: hidden; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; }
canvas { display: block; touch-action: manipulation; }

/* 학습지 문장과 빈칸 */
.ws { font-size: 32px; line-height: 1.7; text-wrap: pretty; }
.ws.sm { font-size: 30px; line-height: 1.6; }
.blank { font: inherit; color: inherit; background: transparent; border: 0; border-bottom: 3px solid var(--ink-2); border-radius: 0; padding: 0 8px; margin: 0 4px;
  cursor: pointer; display: inline-flex; align-items: baseline; gap: 8px; line-height: 1.3; touch-action: manipulation; }
.blank .bn { font-weight: 700; color: var(--energy); }
.blank .ba { visibility: hidden; font-weight: 700; color: var(--pen); }
.blank.on .ba { visibility: visible; }
.blank:hover { background: var(--panel-2); }
.hint { font-size: 22px; color: var(--muted); }
.q { color: var(--heat); font-weight: 700; }
.u { color: var(--energy); font-weight: 700; }
.w { color: var(--work); font-weight: 700; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
sup { font-size: .62em; line-height: 0; }

/* 큰 슬라이더 */
input[type=range].big { -webkit-appearance: none; appearance: none; width: 100%; height: 60px; background: transparent; margin: 0; cursor: pointer; touch-action: none; }
input[type=range].big::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: var(--line); }
input[type=range].big::-webkit-slider-thumb { -webkit-appearance: none; width: 54px; height: 54px; border-radius: 50%; background: var(--ink); border: 7px solid var(--panel); box-shadow: 0 0 0 3px var(--ink); margin-top: -20px; }
input[type=range].big::-moz-range-track { height: 14px; border-radius: 7px; background: var(--line); }
input[type=range].big::-moz-range-thumb { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); border: 7px solid var(--panel); box-shadow: 0 0 0 3px var(--ink); }
.slider { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 20px; }
.slider label { font-weight: 600; white-space: nowrap; }
.slider output { font: 600 30px var(--f-mono); min-width: 150px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 목차 : 한 줄로 이어지는 수업 흐름을 두 칸에 나눠 싣고, 아래에 설정 */
.toc { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 16px 28px; height: 100%; }
.toc-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.toc-card { display: grid; grid-template-columns: 50px 1fr auto; align-items: center; gap: 16px; text-align: left; padding: 8px 20px; min-height: 84px;
  background: var(--panel); border: 2px solid var(--line); border-radius: 14px; color: var(--ink); cursor: pointer; font-size: 28px; touch-action: manipulation; }
.toc-card:hover { border-color: var(--ink-2); }
.toc-num { font: 600 26px var(--f-mono); color: var(--muted); }
.toc-title { font-weight: 600; line-height: 1.25; }
.toc-sub { display: block; font-size: 20px; line-height: 1.35; font-weight: 400; color: var(--muted); }
.toc-ws { font-size: 20px; font-weight: 600; color: var(--muted); white-space: nowrap; text-align: right; }
.toc-bottom { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }
.toc-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 22px; color: var(--muted); }
.toc-foot .btn.small[aria-pressed="true"] { background: var(--panel); color: var(--ink); border-color: var(--ink-2); }

/* 도입 · 마무리 */
/* 예상 ①·② (고르기만 한다) */
.vote { display: grid; grid-template-columns: 56px 1fr; gap: 0 14px; align-items: center; padding: 18px 20px; border: 2px solid var(--line); border-radius: 16px; background: var(--panel-2); }
.vote .vn { font-size: 46px; font-weight: 700; line-height: 1.1; color: var(--energy); }
.vote .vt { font-size: 31px; font-weight: 500; line-height: 1.45; color: var(--ink-2); }
.vote .vt b { display: block; font-weight: 700; color: var(--ink); }
.road { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 14px; padding: 6px 16px; border: 2px solid var(--line); border-radius: 14px;
  background: var(--panel-2); color: var(--ink); text-align: left; cursor: pointer; touch-action: manipulation; }
.road:hover { border-color: var(--ink-2); }
.road .rn { font: 700 26px var(--f-mono); color: var(--muted); }
.road b { display: block; font-size: 28px; line-height: 1.3; }
.road small { display: block; font-size: 21px; line-height: 1.35; color: var(--muted); }
.road .go { font-size: 22px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.why { display: grid; grid-template-columns: 44px 1fr; gap: 0 12px; align-items: start; }
.why .wn { grid-row: span 2; font: 700 24px var(--f-mono); color: var(--panel); background: var(--ink-2); border-radius: 10px; text-align: center; line-height: 40px; height: 40px; }
.why b { font-size: 27px; line-height: 1.4; }
.why span { font-size: 23px; line-height: 1.45; color: var(--ink-2); }
.gen { border: 2px solid var(--line); border-left-width: 8px; border-radius: 16px; padding: 12px 20px; background: var(--panel-2); }
.gen.cold { border-left-color: var(--cold); }
.gen.hot { border-left-color: var(--heat); }
.gen h3 { margin: 0 0 4px; font-size: 29px; line-height: 1.4; }
.gen ul { margin: 0; padding-left: 26px; font-size: 25px; line-height: 1.55; }
/* 나의 예상 : 펜으로 바로 채우는 문장 틀 */
.frame { display: flex; flex-direction: column; gap: 2px; padding: 10px 20px 14px; border: 2px dashed var(--line); border-radius: 14px; }
.frame .fl { display: flex; align-items: flex-end; gap: 12px; font-size: 27px; line-height: 1.5; color: var(--ink-2); white-space: nowrap; }
.frame .sl { flex: 1; height: 46px; border-bottom: 3px solid var(--line); }
.frame .sl.short { flex: none; width: 170px; }

/* 공통 배치 */
.row { display: flex; gap: 24px; min-width: 0; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.fill { flex: 1 1 0; min-width: 0; }
.fix { flex: none; }
.pad { padding: 26px 30px; }
.cap { font-size: 22px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.callout { border-left: 6px solid var(--ink-2); background: var(--panel-2); padding: 14px 20px; border-radius: 0 12px 12px 0; font-size: 28px; }
.callout.good { border-left-color: var(--good); }
.meter { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; }
.meter .m-name { font-weight: 600; }
.meter .m-val { font: 600 30px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter .m-bar { grid-column: 1 / -1; height: 26px; border-radius: 13px; background: var(--panel-2); border: 2px solid var(--line); overflow: hidden; }
.meter .m-bar > i { display: block; height: 100%; border-radius: 13px; background: var(--energy); }

/* 공식 유도 단계 */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.step { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border: 2px dashed var(--line); border-radius: 14px; min-width: 0; }
.step.on { border-style: solid; border-color: var(--ink-2); background: var(--panel-2); }
.step .s-no { font-weight: 700; font-size: 26px; color: var(--muted); }
.step.on .s-no { color: var(--ink); }
.step .s-what { font-size: 26px; line-height: 1.4; }
.step .s-eq { font: 700 34px/1.45 var(--f-sans); letter-spacing: .01em; }
.step .s-eq.small { font-size: 23px; font-weight: 600; }
.step .s-note { font-size: 22px; line-height: 1.4; color: var(--muted); }
.step:not(.on) .s-eq, .step:not(.on) .s-note { visibility: hidden; }

/* 식 */
.eq { font: 600 44px/1.4 var(--f-mono); white-space: nowrap; }
.eq-num { font: 600 30px/1.4 var(--f-mono); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* 표 1 */
.t1 { width: 100%; border-collapse: collapse; table-layout: fixed; }
.t1 th, .t1 td { border: 2px solid var(--line); padding: 8px 12px; text-align: center; vertical-align: middle; }
.t1 th { background: var(--panel-2); font-weight: 700; font-size: 24px; }
.t1 td { font-size: 27px; }
.t1 td.pname { font-weight: 700; }
.t1 tr.cur td { background: var(--panel-2); }
.t1.big th { font-size: 28px; padding: 10px 12px; }
.t1.big td { font-size: 32px; padding: 10px 12px; }

/* 과정 시뮬레이터 */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 84px; padding: 8px 12px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; touch-action: manipulation; }
.tab b { font-size: 32px; line-height: 1.2; }
.tab span { font-size: 21px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.tab[aria-selected="true"] span { color: var(--panel); opacity: .8; }
.ctrl { display: flex; align-items: center; gap: 16px; }
.seg { display: flex; gap: 10px; }

/* 생각 열기 */
.big-q { font-size: 64px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.choice { font-size: 40px; font-weight: 700; min-width: 260px; min-height: 110px; border-radius: 20px; }

/* 주의 카드 */
.mis-line { display: grid; grid-template-columns: 180px 1fr; gap: 16px; padding: 16px 0; border-top: 2px solid var(--line); font-size: 32px; line-height: 1.5; }
.mis-line b { font-weight: 700; }
.mis-line .body { visibility: hidden; }
.mis-line.on .body { visibility: visible; }

/* 과정 맞히기 */
.clues { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.clue { position: relative; padding: 0; overflow: hidden; cursor: pointer; text-align: left; color: var(--ink); display: block; touch-action: manipulation; }
.clue .c-head { display: block; padding: 12px 20px 0; font-size: 28px; font-weight: 700; }
.clue canvas { margin: 0 auto; }
.clue .c-trend { display: block; padding: 0 20px 14px; font-size: 32px; font-weight: 700; text-align: center; }
.clue .cover { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 8px; background: var(--panel-2); font-size: 30px; font-weight: 700; color: var(--ink-2); }
.clue .cover small { font-size: 22px; font-weight: 500; color: var(--muted); }
.answer { font-size: 34px; font-weight: 700; min-height: 88px; }
.answer.right { background: var(--good); border-color: var(--good); color: var(--panel); }
.answer.wrong { border-color: var(--pen); color: var(--pen); }
.reveal { font-size: 30px; line-height: 1.6; }
</style>

</head>
<body>
<div id="frame">
  <div id="stage">
    <header class="bar">
      <div class="bar-left">
        <button class="btn" id="btn-home" type="button">목차</button>
        <div class="titles">
          <div class="kicker"><span id="kicker">03. 열역학 제1법칙</span><span class="ws-chip" id="ws-chip" hidden></span></div>
          <h1 id="scene-title">수업 화면</h1>
        </div>
      </div>
      <div class="pen-tools" role="toolbar" aria-label="필기 도구">
        <button class="tool toggle" id="tool-hand" type="button" aria-pressed="false" title="켜면 손가락·마우스로도 씁니다. 애플 펜슬은 늘 바로 써집니다.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4.5-1L19 8.5a2.1 2.1 0 0 0-3-3L5.5 16 4 20z"/><path d="M14.5 7l2.5 2.5"/></svg><span>손 필기</span></button>
        <button class="tool pick sw" type="button" data-tool="pen" data-color="pen" aria-pressed="true" aria-label="빨간 펜" title="빨간 펜"><i style="background:var(--pen)"></i></button>
        <button class="tool pick sw" type="button" data-tool="pen" data-color="cold" aria-pressed="false" aria-label="파란 펜" title="파란 펜"><i style="background:var(--cold)"></i></button>

<script>

let RES_Z = 1;              // 캔버스를 이 확대 배율에 맞춰 선명하게 그린다 (확대가 멈추면 맞춘다)

/* 반복 그리기 : 지금 화면의 tick 만 부른다 */
let current = null, lastNow = 0;
function loop(now) {
  const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0.016;
  lastNow = now;

/* ═══════════════ 물리 : 이상 기체 (단원자) ═══════════════

  isochoric: { name: '등적 과정', short: '등적', keep: '부피 V', dirs: [{ label: '가열', end: 2 }, { label: '냉각', end: 0.5 }] },
  isothermal: { name: '등온 과정', short: '등온', keep: '온도 T', dirs: [{ label: '팽창 (열을 받음)', end: 4 }, { label: '압축 (열을 내보냄)', end: 1 }] },
  adiabatic: { name: '단열 과정', short: '단열', keep: '열 출입 없음', dirs: [{ label: '팽창', end: 4 }, { label: '압축', end: 1 }] },

/* ═══════════════ 그리기 도구 ═══════════════ */

/* 기체 분자 */
function makeGas(n, box) {
  const ps = [];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    ps.push({ x: box.x + 12 + Math.random() * (box.w - 24), y: box.y + 12 + Math.random() * (box.h - 24), dx: Math.cos(a), dy: Math.sin(a), f: 0.55 + Math.random() * 0.9 });

}

  r = r || 7;
  ps.forEach(function (p) {
    p.x += p.dx * p.f * speed * dt; p.y += p.dy * p.f * speed * dt;
    if (p.x < box.x + r) { p.x = box.x + r; p.dx = Math.abs(p.dx); }
    if (p.x > box.x + box.w - r) { p.x = box.x + box.w - r; p.dx = -Math.abs(p.dx); }
    if (p.y < box.y + r) { p.y = box.y + r; p.dy = Math.abs(p.dy); }
    if (p.y > box.y + box.h - r) { p.y = box.y + box.h - r; p.dy = -Math.abs(p.dy); }

}
function drawGas(ctx, ps, T, r) {

}
function gasSpeed(T) { return 230 * Math.sqrt(Math.max(T, 20) / 300); }

/* 온도계 : 0 ~ 700 K.  initSide : '처음' 표시를 놓을 쪽 */

}

/* 압력계 : 0 ~ pmax (×10⁵ Pa).  label : true(아래) · 'right'(오른쪽) · false */
function dial(ctx, cx, cy, r, P, o) {
  o = o || {};
  const pmax = o.pmax || 3.5, a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
  ctx.fillStyle = COL.panel; ctx.strokeStyle = COL['ink-2']; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  for (let k = 0; k <= pmax * 2 + 0.01; k++) {
    const v = k / 2, a = a0 + (a1 - a0) * v / pmax, big = k % 2 === 0;
    ctx.strokeStyle = COL.muted; ctx.lineWidth = big ? 3 : 2;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (r - 6), cy + Math.sin(a) * (r - 6));
    ctx.lineTo(cx + Math.cos(a) * (r - (big ? 18 : 12)), cy + Math.sin(a) * (r - (big ? 18 : 12))); ctx.stroke();
    if (big) txt(ctx, String(v), cx + Math.cos(a) * (r - 32), cy + Math.sin(a) * (r - 32), { size: r > 80 ? 20 : 16, color: COL.muted, align: 'center', mono: true });
  }
  const a = a0 + (a1 - a0) * clamp(P / pmax, 0, 1);
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * (r - 20), cy + Math.sin(a) * (r - 20)); ctx.stroke();
  dot(ctx, cx, cy, 7, COL.ink);
  if (o.label === 'right') txtU(ctx, P.toFixed(2), UNIT_P, cx + r + 16, cy, { size: 24, weight: 700 });
  else if (o.label !== false) txtU(ctx, P.toFixed(2), UNIT_P, cx, cy + r + 26, { size: 24, weight: 700, align: 'center' });
}

/* P–V 그래프 */
function pvBox(x, y, w, h, vmax, pmax) { return { x: x, y: y, w: w, h: h, vmax: vmax, pmax: pmax }; }
function PX(g, V) { return g.x + V / g.vmax * g.w; }
function PY(g, P) { return g.y + g.h - P / g.pmax * g.h; }
function pvAxes(ctx, g, o) {
  o = o || {};
  ctx.strokeStyle = COL.grid; ctx.lineWidth = 1.5;
  const step = o.grid || 0.5;
  for (let v = step; v <= g.vmax + 1e-6; v += step) { const x = PX(g, v); ctx.beginPath(); ctx.moveTo(x, g.y); ctx.lineTo(x, g.y + g.h); ctx.stroke(); }
  for (let p = step; p <= g.pmax + 1e-6; p += step) { const y = PY(g, p); ctx.beginPath(); ctx.moveTo(g.x, y); ctx.lineTo(g.x + g.w, y); ctx.stroke(); }
  arrow(ctx, g.x, g.y + g.h, g.x + g.w + 26, g.y + g.h, { width: 3, color: COL.ink, head: 14 });
  arrow(ctx, g.x, g.y + g.h, g.x, g.y - 24, { width: 3, color: COL.ink, head: 14 });
  if (o.ticks !== false) {
    for (let v = 1; v <= g.vmax + 1e-6; v += 1) txt(ctx, String(v), PX(g, v), g.y + g.h + 22, { size: 20, color: COL.muted, align: 'center', mono: true });
    for (let p = 1; p <= g.pmax + 1e-6; p += 1) txt(ctx, String(p), g.x - 14, PY(g, p), { size: 20, color: COL.muted, align: 'right', mono: true });
    txt(ctx, '0', g.x - 14, g.y + g.h + 14, { size: 20, color: COL.muted, align: 'right', mono: true });
  }
  txt(ctx, '압력 P (×10^{5} Pa)', g.x + 12, g.y - 26, { size: 21, weight: 600, color: COL['ink-2'] });
  txt(ctx, '부피 V (×10^{−3} m^{3})', g.x + g.w + 20, g.y + g.h + 50, { size: 21, weight: 600, color: COL['ink-2'], align: 'right' });
}
/** 그래프 아래 넓이를 칠한다. 부피가 줄면(압축) 빗금 */
function pvArea(ctx, g, pts, color, negative) {
  if (pts.length < 2) return;
  ctx.beginPath(); ctx.moveTo(PX(g, pts[0].V), PY(g, 0));
  pts.forEach(function (p) { ctx.lineTo(PX(g, p.V), PY(g, p.P)); });
  ctx.lineTo(PX(g, pts[pts.length - 1].V), PY(g, 0)); ctx.closePath();
  ctx.fillStyle = rgba(color, negative ? 0.12 : 0.24); ctx.fill();
  if (negative) {
    ctx.save(); ctx.clip();
    ctx.strokeStyle = rgba(color, 0.55); ctx.lineWidth = 2;
    for (let x = g.x - g.h; x < g.x + g.w + g.h; x += 16) { ctx.beginPath(); ctx.moveTo(x, g.y + g.h); ctx.lineTo(x + g.h, g.y); ctx.stroke(); }

}
function pvLine(ctx, g, pts, color, width, dash) {

  ctx.strokeStyle = color; ctx.lineWidth = width || 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);

/* Q·ΔU·W 막대 (가로, 가운데가 0) */
function energyBars(ctx, w, hgt, vals, maxAbs, o) {
  o = o || {};
  const rows = [
    { key: 'Q', name: '열', v: vals.Q, color: COL.heat },
    { key: 'ΔU', name: '내부 에너지 변화', v: vals.dU, color: COL.energy },
    { key: 'W', name: '기체가 한 일', v: vals.W, color: COL.work },
  ];
  const lx = o.labelW || 300, rx = w - (o.valueW || 150), cx = (lx + rx) / 2, half = (rx - lx) / 2 - 6;
  const rh = hgt / rows.length;
  rows.forEach(function (r, i) {
    const y = i * rh + rh / 2;
    const tw = txt(ctx, r.key, 16, y, { size: 30, weight: 700, color: r.color, mono: true });
    txt(ctx, r.name, 28 + tw, y + 1, { size: 21, color: COL.muted });
    ctx.fillStyle = COL['panel-2']; rrect(ctx, lx, y - rh * 0.28, rx - lx, rh * 0.56, 8); ctx.fill();
    const len = clamp(r.v / maxAbs, -1, 1) * half;
    if (Math.abs(len) > 0.5) { ctx.fillStyle = r.color; rrect(ctx, Math.min(cx, cx + len), y - rh * 0.28, Math.abs(len), rh * 0.56, 6); ctx.fill(); }
    txt(ctx, sgn(r.v) + ' J', w - 12, y, { size: 28, weight: 700, align: 'right', mono: true, color: Math.abs(r.v) < 0.5 ? COL.muted : COL.ink });
  });
  ctx.strokeStyle = COL['ink-2']; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, 4); ctx.lineTo(cx, hgt - 4); ctx.stroke();
}

/* 실린더 (가로로 누운 원통, 오른쪽이 피스톤).  과정 화면들이 같은 자리에 계기를 둔다. */
const CYL = { x0: 210, yTop: 200, H: 210, kx: 128, wall: 12 };
const GAUGE = { x: 290, y: 100, r: 62 };
const THERMO = { x: 74, top: 150, bottom: 470 };
function pistonX(V, geo) { geo = geo || CYL; return geo.x0 + V * geo.kx; }
/**
 * mode : isobaric · isochoric · isothermal · adiabatic · plain
 * heat : +1 들어옴, −1 나감, 0 없음.  t : 시각(화살표 움직임)  moving : 움직이는 중인가
 */
function drawCylinder(ctx, st, gas, o) {
  const g = o.geo || CYL, x0 = g.x0, yT = g.yTop, H = g.H, yB = yT + H, wl = g.wall;
  const xp = pistonX(st.V, g), tubeEnd = x0 + (o.tubeV || 4.4) * g.kx, rod = o.rod || 70, pw = 26;
  const mode = o.mode || 'plain';
  // 항온조 (등온) : 실린더를 일정한 온도의 물에 담근다
  if (mode === 'isothermal') {
    ctx.fillStyle = rgba(COL.cold, 0.13); rrect(ctx, x0 - 46, yT - 40, tubeEnd - x0 + 70, H + 112, 18); ctx.fill();
    ctx.strokeStyle = rgba(COL.cold, 0.5); ctx.lineWidth = 3; rrect(ctx, x0 - 46, yT - 40, tubeEnd - x0 + 70, H + 112, 18); ctx.stroke();
    txt(ctx, '항온조 : 온도가 일정한 물', x0 - 40, yB + 98, { size: 22, weight: 600, color: COL.cold });
  }
  // 단열재
  if (mode === 'adiabatic') {
    ctx.save();
    ctx.beginPath(); ctx.rect(x0 - wl - 28, yT - wl - 28, tubeEnd - x0 + wl + 28, H + 2 * wl + 56); ctx.rect(x0 - wl, yT - wl, tubeEnd - x0 + wl + 2, H + 2 * wl); ctx.clip('evenodd');
    ctx.fillStyle = rgba(COL.muted, 0.18); ctx.fillRect(x0 - wl - 28, yT - wl - 28, tubeEnd - x0 + wl + 28, H + 2 * wl + 56);
    ctx.strokeStyle = rgba(COL.muted, 0.6); ctx.lineWidth = 2;
    for (let x = x0 - 300; x < tubeEnd + 300; x += 18) { ctx.beginPath(); ctx.moveTo(x, yB + 60); ctx.lineTo(x + 120, yT - 60); ctx.stroke(); }
    ctx.restore();
    txt(ctx, '단열재 : 열이 드나들지 않는다', x0 - 40, yB + 72, { size: 22, weight: 600, color: COL['ink-2'] });
  }
  // 기체가 든 곳 (온도에 따라 옅은 색)
  ctx.fillStyle = rgba(tempColor(st.T), 0.1);
  ctx.fillRect(x0, yT, xp - x0, H);
  if (gas) drawGas(ctx, gas, st.T, o.r);
  // 원통 벽
  ctx.fillStyle = COL['ink-2'];
  ctx.fillRect(x0 - wl, yT - wl, tubeEnd - x0 + wl, wl);
  ctx.fillRect(x0 - wl, yB, tubeEnd - x0 + wl, wl);
  ctx.fillRect(x0 - wl, yT - wl, wl, H + 2 * wl);
  // 피스톤과 막대
  ctx.fillStyle = COL.ink; ctx.fillRect(xp, yT + 3, pw, H - 6);
  ctx.fillStyle = COL['ink-2']; ctx.fillRect(xp + pw, yT + H / 2 - 9, rod, 18);
  // 등적 : 피스톤 고정 핀
  if (mode === 'isochoric') {
    ctx.fillStyle = COL.pen;
    [yT - wl - 22, yB - 6].forEach(function (y) { rrect(ctx, xp + pw / 2 - 7, y, 14, wl + 30, 4); ctx.fill(); });
    pill(ctx, '피스톤 고정', xp + pw / 2, yT - wl - 44, COL.pen, { align: 'center', size: 20 });
  }
  // 등압 : 바깥에서 같은 압력으로 미는 화살표
  if (mode === 'isobaric') {
    const xr = xp + pw + rod + 10;
    [-1, 0, 1].forEach(function (k) { arrow(ctx, xr + 70, yT + H / 2 + k * 34, xr + 6, yT + H / 2 + k * 34, { width: 4, color: COL.muted, head: 14 }); });
    txt(ctx, '바깥 압력 일정', Math.min(xr + 76, 930), yT + H / 2 - 74, { size: 20, weight: 600, color: COL.muted, align: 'right' });
  }
  // 열의 흐름 : 가열판 · 냉각판 또는 항온조에서 화살표로
  const heat = o.heat || 0, qWord = heat > 0 ? 'Q 들어옴' : 'Q 나감';
  if (o.burner && mode !== 'adiabatic' && mode !== 'isothermal') {
    const by = yB + wl + 30, bw = Math.min(520, tubeEnd - x0 - 40), hot = o.burnerOn !== false;
    ctx.fillStyle = rgba(hot ? COL.heat : COL.cold, 0.85);
    rrect(ctx, x0 + 20, by, bw, 20, 6); ctx.fill();
    txt(ctx, (hot ? '가열' : '냉각') + (heat ? ' : ' + qWord : ''), x0 + 32 + bw, by + 10, { size: 22, weight: 700, color: hot ? COL.heat : COL.cold });
  }
  if (mode === 'isothermal' && heat) txt(ctx, qWord, tubeEnd + 12, yB + 98, { size: 22, weight: 700, color: COL.heat, align: 'right' });
  if (heat !== 0) {
    const off = o.moving ? ((o.t || 0) * 40) % 26 : 8;
    const xs = [x0 + 60, x0 + 170, x0 + 280, x0 + 390].filter(function (x) { return x < xp - 30; });
    const yA = mode === 'isothermal' ? yB + 62 : yB + wl + 26, yZ = yB - 34;
    xs.forEach(function (x) {
      const from = heat > 0 ? yA : yZ, to = heat > 0 ? yZ : yA;
      const shift = (heat > 0 ? -1 : 1) * off * 0.3;
      arrow(ctx, x, from + shift, x, to + shift, { width: 5, color: COL.heat, head: 18, dash: [10, 8] });
    });
  }
  return { xp: xp, pw: pw, rodEnd: xp + pw + rod };
}
/** 압력계와 관 (실린더 위) */
function drawGauge(ctx, P, keep) {

  ctx.fillRect(GAUGE.x - 8, GAUGE.y + GAUGE.r - 4, 16, CYL.yTop - CYL.wall - (GAUGE.y + GAUGE.r) + 6);
  dial(ctx, GAUGE.x, GAUGE.y, GAUGE.r, P, { pmax: 3.5, label: 'right' });

/* ═══════════════ 도입 · 마무리 : 떠오르는 공기 덩어리와 구름 ═══════════════
   그림은 1040×740. 높이 1 km = 180 px.
   공기 덩어리 : 구름이 생기기 전에는 1 km마다 10 °C, 구름 속에서는 약 6 °C 식는다.
   주변 기온 : 1 km마다 평균 6.5 °C 낮아진다. 공기 덩어리 크기는 실제보다 크게 부풀려 그린다. */
const AIR = { W: 1040, H: 740, ground: 660, km: 180, x: 600, T0: 26, lcl: 1.25, h0: 0.15, h1: 2.6 };
const AIR_P = ['1013 hPa', '900 hPa', '800 hPa', '700 hPa'];
function airY(hk) { return AIR.ground - hk * AIR.km; }
function airT(hk) { return hk <= AIR.lcl ? AIR.T0 - 10 * hk : AIR.T0 - 10 * AIR.lcl - 6 * (hk - AIR.lcl); }
function envT(hk) { return 20 - 6.5 * hk; }
function airR(hk) { return 46 * (1 + 0.16 * hk); }
/** 섭씨온도의 색 : 0 °C 파랑 → 13 °C 회색 → 26 °C 주황 */
function cColor(tc) { return tc <= 13 ? mix(COL.cold, COL.muted, clamp(tc / 13, 0, 1)) : mix(COL.muted, COL.heat, clamp((tc - 13) / 13, 0, 1)); }
function makeAir() {
  const mols = [], drops = [];
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.75, b = Math.random() * Math.PI * 2;
    mols.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, dx: Math.cos(b), dy: Math.sin(b) });
  }
  for (let i = 0; i < 24; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.85;
    drops.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, s: 2.5 + Math.random() * 2.5 });
  }
  return { t: 0, mols: mols, drops: drops };
}
/** 뭉게구름 : 바닥이 평평하고 위로 몽글몽글 솟는다. 아래쪽에 옅은 그늘 */
function drawCloud(c, cx, base, color, shade) {
  const puffs = [
    [-182, -34, 44], [-124, -42, 58], [-50, -48, 68], [36, -50, 70], [116, -44, 60], [180, -34, 44],
    [-118, -108, 54], [-40, -128, 72], [52, -120, 66], [128, -98, 48],
    [-62, -192, 54], [18, -208, 62], [86, -176, 44], [-16, -262, 44],
  ];
  c.save();
  c.beginPath(); c.rect(cx - 420, 0, 840, base); c.clip();          // 구름 바닥은 평평하다
  c.fillStyle = shade;
  puffs.forEach(function (p) { c.beginPath(); c.arc(cx + p[0] + 5, base + p[1] + 8, p[2], 0, Math.PI * 2); c.fill(); });
  c.fillStyle = color;
  puffs.forEach(function (p) { c.beginPath(); c.arc(cx + p[0], base + p[1], p[2], 0, Math.PI * 2); c.fill(); });
  c.restore();
}
/** o.mode : 'ask'(도입 질문) · 'key'(핵심 질문) · 'explain'(처음 질문 해결, o.step 0~5) */
function drawAir(c, st, dt, o) {
  const W = AIR.W, H = AIR.H, G = AIR.ground, dark = isDark(), step = o.step || 0, explain = o.mode === 'explain';
  st.t = (st.t + dt) % 10;
  const u = Math.min(1, st.t / 8.6), fade = st.t > 8.6 ? Math.max(0, 1 - (st.t - 8.6) / 1.2) : 1;
  const hk = AIR.h0 + (AIR.h1 - AIR.h0) * u, x = AIR.x, y = airY(hk), r = airR(hk), T = airT(hk);
  c.clearRect(0, 0, W, H);
  // 하늘 · 해 · 땅
  const sky = c.createLinearGradient(0, 0, 0, G);
  sky.addColorStop(0, dark ? '#0F2235' : '#BCD7F1'); sky.addColorStop(1, dark ? '#1C2E3F' : '#EDF5FC');
  c.fillStyle = sky; c.fillRect(0, 0, W, G);
  const sun = dark ? '#E2B23C' : '#FFC53D';
  c.fillStyle = sun; c.beginPath(); c.arc(962, 92, 34, 0, Math.PI * 2); c.fill();
  c.strokeStyle = sun; c.lineWidth = 5; c.lineCap = 'round';
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; c.beginPath(); c.moveTo(962 + Math.cos(a) * 46, 92 + Math.sin(a) * 46); c.lineTo(962 + Math.cos(a) * 62, 92 + Math.sin(a) * 62); c.stroke(); }
  c.fillStyle = dark ? '#2A4330' : '#A8C98E'; c.fillRect(0, G, W, H - G);
  c.fillStyle = dark ? '#35553C' : '#8CB676'; c.fillRect(0, G, W, 10);
  txt(c, '햇볕에 데워진 땅', W - 28, H - 36, { size: 22, weight: 600, color: dark ? '#CFE3C8' : '#2F5A2A', align: 'right' });
  c.strokeStyle = rgba(COL.heat, 0.45); c.lineWidth = 3;           // 아지랑이
  [-70, 0, 70].forEach(function (dx, i) {
    c.beginPath();
    for (let k = 0; k <= 12; k++) { const yy = G - 8 - k * 5, xx = x + dx + Math.sin(k * 0.9 + st.t * 4 + i) * 5; if (k) c.lineTo(xx, yy); else c.moveTo(xx, yy); }
    c.stroke();
  });
  // 높이 축 : 옆에 주변 기온, 마무리 1단계부터는 기압
  const ax = 120, showP = explain && step >= 1;
  c.strokeStyle = COL['ink-2']; c.lineWidth = 3;
  c.beginPath(); c.moveTo(ax, G); c.lineTo(ax, airY(3) - 12); c.stroke();
  for (let k = 0; k <= 3; k++) {
    const yy = airY(k);
    c.beginPath(); c.moveTo(ax - 8, yy); c.lineTo(ax + 8, yy); c.stroke();
    txt(c, k + ' km', ax - 14, yy, { size: 21, weight: 600, color: COL['ink-2'], align: 'right', halo: true });
    txt(c, showP ? AIR_P[k] : Math.round(envT(k)) + ' °C', ax + 16, yy, { size: 21, weight: showP ? 700 : 500, color: showP ? COL.ink : COL.muted, halo: true });
  }
  txt(c, showP ? '높이 · 기압' : '높이 · 주변 기온', 24, airY(3) - 46, { size: 21, weight: 700, color: COL['ink-2'], halo: true });
  // 구름 바닥(이슬점에 이르는 높이)과 구름
  const yl = airY(AIR.lcl);
  c.strokeStyle = rgba(COL.muted, 0.7); c.lineWidth = 2; c.setLineDash([10, 8]);
  c.beginPath(); c.moveTo(ax + 130, yl); c.lineTo(W - 24, yl); c.stroke(); c.setLineDash([]);
  drawCloud(c, x, yl, dark ? '#B7C4D1' : '#FFFFFF', dark ? '#8796A6' : '#D6E3EF');
  txt(c, '구름 바닥', W - 24, yl + 22, { size: 21, color: COL.muted, align: 'right', halo: true });
  // 공기 덩어리
  c.save(); c.globalAlpha = fade;
  const wet = clamp((hk - AIR.lcl) / 0.35, 0, 1);
  c.fillStyle = rgba(cColor(T), 0.3 * (1 - wet) + 0.06);
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  const sp = 0.9 * Math.sqrt((T + 273) / 299);                   // 분자의 빠르기 ∝ √절대온도
  st.mols.forEach(function (m) {
    m.x += m.dx * sp * dt; m.y += m.dy * sp * dt;
    const d = Math.hypot(m.x, m.y);
    if (d > 0.82) { const nx = m.x / d, ny = m.y / d, vn = m.dx * nx + m.dy * ny; if (vn > 0) { m.dx -= 2 * vn * nx; m.dy -= 2 * vn * ny; } m.x = nx * 0.82; m.y = ny * 0.82; }
  });
  c.fillStyle = cColor(T);
  st.mols.forEach(function (m) { c.beginPath(); c.arc(x + m.x * r, y + m.y * r, 5, 0, Math.PI * 2); c.fill(); });
  if (wet > 0) {
    c.fillStyle = rgba(dark ? '#E6EDF3' : mix(COL.cold, '#FFFFFF', 0.45), 0.9 * wet);
    st.drops.forEach(function (d) { c.beginPath(); c.arc(x + d.x * r, y + d.y * r, d.s, 0, Math.PI * 2); c.fill(); });
  }
  c.strokeStyle = COL['ink-2'];
  if (explain && step >= 3) { c.lineWidth = 6; } else { c.lineWidth = 3; c.setLineDash([10, 7]); }
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
  pill(c, Math.round(T) + ' °C', x + r + 44, y - 18, cColor(T), { size: 24 });
  // 도입 : 같은 높이의 주변 기온을 나란히 보여 준다 (공기 덩어리가 늘 조금 더 따뜻하다)
  if (!explain) txt(c, '주변 ' + Math.round(envT(hk)) + ' °C', x + r + 44, y + 22, { size: 22, weight: 600, color: COL.muted, halo: true });
  if (o.mode === 'ask' && hk < 0.95) {
    txt(c, '따뜻한 공기 덩어리', x - r - 48, y - 6, { size: 24, weight: 700, align: 'right', halo: true });
    arrow(c, x - r - 22, y + 40, x - r - 22, y - 40, { width: 4, color: COL['ink-2'], head: 16 });
  }
  if (o.mode === 'key') txt(c, '왜 식을까?', x + r + 44, y + 64, { size: 30, weight: 700, color: COL.pen, halo: true });
  if (explain && step >= 2) {
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4 + Math.PI / 8;
      arrow(c, x + Math.cos(a) * (r + 6), y + Math.sin(a) * (r + 6), x + Math.cos(a) * (r + 30), y + Math.sin(a) * (r + 30), { width: 4, color: COL.work, head: 14 });
    }
    txt(c, '부풀며 바깥 공기를 밀어냄', x - r - 44, y - 14, { size: 22, weight: 700, color: COL.work, align: 'right', halo: true });
    txt(c, 'W > 0', x - r - 44, y + 18, { size: 26, weight: 700, color: COL.work, align: 'right', mono: true, halo: true });
  }
  if (explain && step >= 3) pill(c, 'Q ≈ 0 (단열)', x, y - r - 50, COL['ink-2'], { size: 21, align: 'center' });
  if (explain && step >= 4) txt(c, 'ΔU < 0 → 온도 ↓', x + r + 44, y + 22, { size: 24, weight: 700, color: COL.energy, halo: true });
  // 구름 바닥을 지나면 공기 덩어리를 따라다니는 설명 (고정 글자는 덩어리와 겹친다)
  if (explain && step >= 5 && hk > AIR.lcl + 0.4) txt(c, '이슬점 → 물방울 → 구름', x + r + 44, y + 58, { size: 22, weight: 700, color: COL.cold, halo: true });
  c.restore();
}

/* 도입의 예상 ①·② : [까닭, 결론]. 선생님의 처음 질문("…열을 빼앗겨 식는 것일까, 아니면 공기 스스로 식는 것일까?")을 둘로 나눈 것 */

  const ps = makeGas(46, { x: geo.x0, y: geo.yTop, w: V1 * geo.kx, h: geo.H });
  const NUM = { P: '1.0 × 10^{5} Pa', A: '1.0 × 10^{−2} m^{2}', d: '0.10 m', F: '1.0 × 10^{3} N' };
  const NB = ' ';
  const STEPS = [
    { what: '기체가 피스톤을 미는 힘을 구한다.', eq: 'F = PA', eqN: 'F = PA = (1.0×10^{5})(1.0×10^{−2}) = 1.0×10^{3}' + NB + 'N', note: '압력의 정의 P = F/A 를 F 에 대하여 쓴 것이다.' },
    { what: '힘이 한 일을 구한다.', eq: 'W = Fd = PAd', eqN: 'W = Fd = (1.0×10^{3})(0.10) = 100' + NB + 'J', note: '일 = 힘 × 이동 거리 (힘과 이동 방향이 같다).' },

    { what: '정리한다.', eq: '∴ W = PΔV', eqN: '∴ W = PΔV = (1.0×10^{5})(1.0×10^{−3}) = 100' + NB + 'J', note: '압력이 일정할 때 성립하는 식이다.' },

    h('div', { class: 'row', style: 'gap:18px' },

      h('section', { class: 'panel fix', style: 'padding:0' }, pv.c)),

/** 자전거 펌프 : 빠르게 누르고(0.5초) 잠시 멈췄다가 천천히 돌아온다. 열 출입 없이 부피만 바뀐다 (단열 압축).
    그림은 330×380 기준이고 s 배로 줄여 그린다 */
function makePump(cv, s) {
  const BX = 60, BW = 110, BOT = 330, TOPY = 120, LOWY = 214;
  const ps = makeGas(26, { x: BX, y: TOPY + 14, w: BW, h: BOT - TOPY - 14 });
  let ph = 0;
  return function (dt) {
    ph = (ph + dt) % 3.4;
    let u;
    if (ph < 0.45) u = ph / 0.45; else if (ph < 1.6) u = 1; else if (ph < 3.0) u = 1 - (ph - 1.6) / 1.4; else u = 0;
    const yp = TOPY + (LOWY - TOPY) * u;
    const T = 300 * Math.pow((BOT - TOPY - 14) / (BOT - yp - 14), 2 / 3);
    const c = cv.ctx; c.clearRect(0, 0, cv.w, cv.h);
    c.save(); c.scale(s, s);
    const gasBox = { x: BX, y: yp + 14, w: BW, h: BOT - yp - 14 };
    stepGas(ps, gasBox, dt, gasSpeed(T), 6);
    c.fillStyle = rgba(tempColor(T), 0.16); c.fillRect(gasBox.x, gasBox.y, gasBox.w, gasBox.h);
    drawGas(c, ps, T, 6);
    c.fillStyle = COL['ink-2'];
    c.fillRect(BX - 10, 60, 10, BOT - 50); c.fillRect(BX + BW, 60, 10, BOT - 50); c.fillRect(BX - 10, BOT, BW + 20, 10);
    c.fillStyle = COL.ink; c.fillRect(BX, yp, BW, 14);
    c.fillRect(BX + BW / 2 - 6, yp - 76, 12, 76);
    rrect(c, BX - 40, yp - 96, BW + 80, 22, 8); c.fill();
    if (u > 0.02 && ph < 0.6) arrow(c, BX + BW + 60, yp - 110, BX + BW + 60, yp - 50, { width: 6, color: COL['ink-2'], head: 20 });
    txt(c, '빠르게 누른다', BX + BW / 2, BOT + 30, { size: 22, weight: 600, align: 'center', color: COL.muted });
    if (T > 360) txt(c, '뜨거워진다!', BX + BW + 22, (yp + BOT) / 2, { size: 22, weight: 700, color: COL.heat });
    c.restore();
  };
}

      h('button', { class: 'btn', type: 'button', text: '다시 가리기', onclick: function () { lines.forEach(function (l, i) { l.classList.toggle('on', i === 0); }); } })));
    dirBox.replaceChildren();
    PROCS[cd.kind].dirs.forEach(function (d, i) { dirBox.append(h('button', { class: 'btn', type: 'button', 'aria-pressed': String(i === dir), text: d.label, onclick: function () { dir = i; s = 0; playing = true; render(); } })); });
    setText(playBtn, playing ? '멈춤' : '재생');
  }
  const ps = makeGas(54, { x: CYL.x0, y: CYL.yTop, w: 2 * CYL.kx, h: CYL.H });
  root.append(h('div', { class: 'row', style: 'height:100%;gap:20px' },
    h('section', { class: 'panel pad fill' }, textBox),
    h('section', { class: 'panel col fix', style: 'padding:0;gap:4px;justify-content:center' }, cyl.c,
      h('div', { class: 'row', style: 'padding:0 20px;align-items:baseline;justify-content:space-between' }, eqTop, eqNum),
      h('div', { class: 'ctrl', style: 'padding:6px 20px 16px' }, dirBox, playBtn))));
  render();
  return {
    annoKey: function () { return 'mis:' + which; },
    tick: function (dt, now) {
      const cd = CARDS[which];
      if (playing) { s += dt / 4; if (s > 1.35) s = 0; }
      const sv = Math.min(1, s);
      const end = PROCS[cd.kind].dirs[dir].end;
      const st = stateAt(cd.kind, end, sv), fin = stateAt(cd.kind, end, 1);
      const c = cyl.ctx; c.clearRect(0, 0, cyl.w, cyl.h);
      stepGas(ps, { x: CYL.x0, y: CYL.yTop, w: pistonX(st.V) - CYL.x0, h: CYL.H }, dt, gasSpeed(st.T), 7);
      drawCylinder(c, st, ps, { mode: cd.kind, heat: cd.kind === 'adiabatic' || sv < 0.002 ? 0 : Math.sign(fin.Q), t: now, moving: playing && s < 1 });
      drawThermo(c, st.T, cd.kind === 'isothermal');
      const head = cd.kind === 'isothermal' ? (dir === 0 ? '열을 넣으면서 천천히 팽창' : '열을 내보내면서 천천히 압축') : (dir === 1 ? '자전거 펌프를 누를 때처럼 압축' : '산을 오르는 공기처럼 팽창');
      txt(c, head, 210, 60, { size: 28, weight: 700 });
      setText(eqNum, num(st.Q) + ' J = ' + term(st.dU) + ' + ' + term(st.W));
    },
  };
}

      const rowsC = [{ name: '압력 일정 (등압)', dU: 300, W: 200, T: 450 }, { name: '부피 고정 (등적)', dU: 500, W: 0, T: 550 }];

        txt(k, 'ΔU ' + r.dU, x0 + 12, y + 1, { size: 22, weight: 700, color: COL.panel, mono: true });
        if (r.W) txt(k, 'W ' + r.W, x0 + r.dU * sc + 16, y + 1, { size: 22, weight: 700, color: COL.panel, mono: true });
        txt(k, '→ ' + r.T + ' K', cmp.w - 4, y, { size: 26, weight: 700, align: 'right', mono: true, color: COL.heat });
      });
      txt(k, '일로 나간 에너지가 없으면 ΔU 가 더 커서 온도가 더 많이 오른다.', 0, 150, { size: 22, color: COL.muted });
    },

}

/* ── 10. 한눈에 비교 (선택) ── */
function sceneCompare(root) {
  const g = makeCanvas(1060, 900);

  const ends = { isobaric: 4, isothermal: 4, adiabatic: 4, isochoric: 2 };
  const tbody = h('tbody', {});
  const btns = ORDER.map(function (k) {
    return h('button', { class: 'btn small', type: 'button', text: PROCS[k].name, onclick: function () { focus = k; sync(); } });
  });
  function sync() { btns.forEach(function (b, i) { b.setAttribute('aria-pressed', String(ORDER[i] === focus)); }); }
  ORDER.forEach(function (k) {
    const f = stateAt(k, ends[k], 1);
    tbody.append(h('tr', {}, h('td', { class: 'pname', text: PROCS[k].name }), h('td', { class: 'mono', text: sgn(f.W) }), h('td', { class: 'mono', text: sgn(f.dU) }), h('td', { class: 'mono', text: sgn(f.Q) }), h('td', { class: 'mono', text: Math.round(f.T) + ' K' })));
  });

      h('p', { class: 'ws sm' }, '같은 처음 상태(300 K)에서 부피를 2 → 4 (×10', h('sup', { text: '−3' }), ' m', h('sup', { text: '3' }), ')로 팽창시킨 세 과정과, 부피를 고정한 채 가열한 등적 과정을 비교한다.'),

      h('div', { class: 'callout good', style: 'font-size:30px' }, '같은 부피만큼 팽창하면 한 일은 ', h('b', { text: '등압 > 등온 > 단열' }), '. 그래프 아래 넓이를 비교하면 보인다.'))));

      ORDER.forEach(function (k) {
        const pts = pathOf(k, ends[k], 1);

        dot(c, PX(gb, last.V), PY(gb, last.P), 8, colOf(k));
        const lab = { isobaric: [14, -24], isothermal: [14, -22], adiabatic: [14, 24], isochoric: [18, 0] }[k];

      });

/* ── 11. 과정 맞히기 ── */
function sceneGuess(root) {
  const PUZ = [
    { k: 'adiabatic', d: 0 }, { k: 'isobaric', d: 0 }, { k: 'isothermal', d: 0 }, { k: 'isochoric', d: 0 },
    { k: 'adiabatic', d: 1 }, { k: 'isothermal', d: 1 }, { k: 'isochoric', d: 1 }, { k: 'isobaric', d: 1 },
  ];
  const WHY = {
    isobaric0: ['압력이 처음과 같다 → 등압 과정', '부피가 늘어 W > 0, 온도가 올라 ΔU > 0 이므로 Q = ΔU + W > 0 : 열이 들어왔다.'],
    isobaric1: ['압력이 처음과 같다 → 등압 과정', '부피가 줄어 W < 0, 온도가 내려 ΔU < 0 이므로 Q < 0 : 열이 나갔다.'],
    isochoric0: ['부피가 그대로다 → 등적 과정', 'W = 0 이므로 Q = ΔU. 들어온 열이 모두 내부 에너지가 되어 온도와 압력이 올라갔다.'],
    isochoric1: ['부피가 그대로다 → 등적 과정', 'W = 0 이므로 Q = ΔU < 0. 열이 나간 만큼 내부 에너지가 줄어 온도와 압력이 내려갔다.'],
    isothermal0: ['온도가 그대로다 → 등온 과정', 'ΔU = 0 이므로 Q = W. 들어온 열이 모두 일이 되어 부피가 늘고 압력이 줄었다.'],
    isothermal1: ['온도가 그대로다 → 등온 과정', 'ΔU = 0 이므로 Q = W < 0. 받은 일만큼 열이 나갔다.'],
    adiabatic0: ['열이 드나들지 않았다 → 단열 과정', 'Q = 0, 부피가 늘어 W > 0 이므로 ΔU = −W < 0 : 온도가 내려갔다.'],
    adiabatic1: ['열이 드나들지 않았다 → 단열 과정', 'Q = 0, 부피가 줄어 W < 0 이므로 ΔU = −W > 0 : 온도가 올라갔다.'],
  };
  let pi = 0, opened = [false, false, false, false], chosen = null, shown = false, s = 0;
  const covers = [], trends = [], cvs = [];
  const NAMES = ['부피', '압력', '온도', '열 출입'];
  const cards = NAMES.map(function (name, i) {
    const cv = makeCanvas(420, 300);
    const trend = h('span', { class: 'c-trend' });
    const cover = h('span', { class: 'cover' }, '단서 ' + (i + 1) + ' : ' + name, h('small', { text: '눌러서 열기' }));
    covers.push(cover); trends.push(trend); cvs.push(cv);
    return h('button', { class: 'panel clue', type: 'button', 'aria-label': '단서 ' + (i + 1) + ' ' + name, onclick: function () { opened[i] = true; render(); } },
      h('span', { class: 'c-head', text: name }), cv.c, trend, cover);
  });
  const count = h('span', { class: 'mono', style: 'font-weight:700' });
  const numEl = h('span', { class: 'mono', style: 'font-weight:700' });
  const answers = ORDER.map(function (k) { return h('button', { class: 'btn answer fill', type: 'button', text: PROCS[k].name, onclick: function () { chosen = k; render(); } }); });
  const reveal = h('div', { class: 'reveal' });
  const showBtn = h('button', { class: 'btn primary', type: 'button', text: '정답 보기', onclick: function () { shown = true; opened = [true, true, true, true]; render(); } });
  const nextBtn = h('button', { class: 'btn', type: 'button', text: '다음 문제', onclick: function () { pi = (pi + 1) % PUZ.length; opened = [false, false, false, false]; chosen = null; shown = false; s = 0; render(); } });
  root.append(h('div', { class: 'col', style: 'height:100%;gap:18px' },
    h('div', { class: 'row', style: 'align-items:center;justify-content:space-between' },
      h('p', { class: 'ws', style: 'font-size:34px;font-weight:700' }, '어떤 과정일까? 단서를 적게 열고 맞혀 보자.'),
      h('div', { style: 'font-size:28px;white-space:nowrap' }, '문제 ', numEl, ' · 연 단서 ', count)),
    h('div', { class: 'clues' }, cards),
    h('div', { class: 'row', style: 'gap:16px' }, answers),
    h('section', { class: 'panel row pad', style: 'gap:24px;align-items:center;flex:1;min-height:0' }, h('div', { class: 'fill' }, reveal), h('div', { class: 'col fix', style: 'gap:12px' }, showBtn, nextBtn))));
  function render() {
    const P = PUZ[pi], key = P.k + P.d;
    numEl.textContent = (pi + 1) + '/' + PUZ.length;
    count.textContent = opened.filter(Boolean).length + '개';
    covers.forEach(function (c, i) { c.hidden = opened[i]; });
    answers.forEach(function (b, i) {
      const k = ORDER[i];
      b.classList.toggle('right', shown && k === P.k);
      b.classList.toggle('wrong', shown && chosen === k && k !== P.k);
      b.setAttribute('aria-pressed', String(chosen === k && !shown));
    });
    reveal.replaceChildren();
    if (shown) reveal.append(h('b', { text: PROCS[P.k].name + ' (' + PROCS[P.k].dirs[P.d].label + ')' }), h('br'), WHY[key][0], h('br'), WHY[key][1]);
    else reveal.append(chosen ? '고른 답 : ' + PROCS[chosen].name + '. 근거를 Q = ΔU + W 로 말해 보세요.' : '모둠에서 답을 정하고, 근거를 Q = ΔU + W 로 말해 보세요.');
  }
  render();
  function trendWord(a, b, up, down) { if (Math.abs(b - a) < 1e-3) return '그대로다'; return b > a ? up : down; }
  return {
    annoKey: function () { return 'guess:' + pi; },     // 문제마다 새 필기
    tick: function (dt, now) {
      const P = PUZ[pi];
      s += dt / 3.6; if (s > 1.5) s = 0;
      const sv = Math.min(1, s), end = PROCS[P.k].dirs[P.d].end;
      const st = stateAt(P.k, end, sv), fin = stateAt(P.k, end, 1);
      const words = [
        trendWord(S0.V, fin.V, '늘어난다', '줄어든다'),
        trendWord(S0.P, fin.P, '커진다', '작아진다'),
        trendWord(S0.T, fin.T, '올라간다', '내려간다'),
        Math.abs(fin.Q) < 0.5 ? '없다' : fin.Q > 0 ? '들어온다' : '나간다',
      ];
      trends.forEach(function (t, i) { setText(t, words[i]); });
      // 부피
      let c = cvs[0].ctx; c.clearRect(0, 0, 420, 300);
      const kx = 70;
      c.fillStyle = COL['ink-2']; c.fillRect(32, 62, 336, 8); c.fillRect(32, 190, 336, 8); c.fillRect(32, 62, 8, 136);
      c.fillStyle = rgba(tempColor(st.T), 0.18); c.fillRect(40, 70, st.V * kx, 120);
      c.fillStyle = COL.ink; c.fillRect(40 + st.V * kx, 72, 16, 116);
      txtU(c, st.V.toFixed(2), UNIT_V, 210, 250, { size: 26, weight: 700, align: 'center' });
      // 압력
      c = cvs[1].ctx; c.clearRect(0, 0, 420, 300);
      dial(c, 210, 136, 104, st.P, { pmax: 3.5, label: false });
      txtU(c, st.P.toFixed(2), UNIT_P, 210, 272, { size: 26, weight: 700, align: 'center' });
      // 온도
      c = cvs[2].ctx; c.clearRect(0, 0, 420, 300);
      thermometer(c, 170, 26, 250, st.T, { init: 300, label: false });
      txt(c, Math.round(st.T) + ' K', 250, 140, { size: 34, weight: 700, mono: true });
      // 열 출입
      c = cvs[3].ctx; c.clearRect(0, 0, 420, 300);
      c.strokeStyle = COL['ink-2']; c.lineWidth = 6; rrect(c, 120, 80, 180, 110, 14); c.stroke();
      txt(c, '기체', 210, 135, { size: 26, weight: 700, align: 'center', color: COL.muted });
      if (Math.abs(fin.Q) < 0.5) {
        c.strokeStyle = COL.pen; c.lineWidth = 6;
        c.beginPath(); c.moveTo(186, 222); c.lineTo(234, 270); c.moveTo(234, 222); c.lineTo(186, 270); c.stroke();
        txt(c, '열이 드나들지 않는다', 210, 40, { size: 26, weight: 700, align: 'center' });
      } else {
        const inn = fin.Q > 0, off = (now * 40) % 30;
        [150, 210, 270].forEach(function (x) {
          if (inn) arrow(c, x, 286 - off * 0.4, x, 204, { width: 6, color: COL.heat, head: 20, dash: [10, 8] });
          else arrow(c, x, 202, x, 282 - off * 0.4, { width: 6, color: COL.heat, head: 20, dash: [10, 8] });
        });
        txt(c, inn ? '열이 들어온다' : '열이 나간다', 210, 40, { size: 26, weight: 700, align: 'center', color: COL.heat });
      }
    },
  };

/** 확대가 멈추고 잠시 뒤, 캔버스와 필기를 지금 배율에 맞는 해상도로 다시 그린다 */
function sharpenLater() {
  clearTimeout(sharpenTimer);
  sharpenTimer = setTimeout(function sharpen() {
    if (INK.active || VG.pinch) { sharpenTimer = setTimeout(sharpen, 300); return; }
    if (Math.abs(RES_Z - ZT.z) < 0.01) return;
    RES_Z = ZT.z;
    canvases.forEach(function (c) { c.resize(); });
    layers.forEach(function (l) { l.resize(); });
    if (inkReady) redrawInk();
  }, 250);
}
/** 화면을 바꿀 때 : 바로 원래 크기로 (애니메이션 없이) */
function resetZoomNow() {
  VG.pinch = null; VG.drag = null; stage.classList.remove('panning');
  clearTimeout(sharpenTimer);
  if (ZT.z !== 1 || ZT.x || ZT.y) { ZT.z = 1; ZT.x = 0; ZT.y = 0; applyZoom(); }
  if (RES_Z !== 1) { RES_Z = 1; layers.forEach(function (l) { l.resize(); }); if (inkReady) redrawInk(); }
}
function viewPt(x, y) { const r = viewEl.getBoundingClientRect(); return { x: (x - r.left) / SCALE, y: (y - r.top) / SCALE }; }
function inView(el) { return !!(el && el.closest && el.closest('#view')); }
function isControl(el) { return !!(el && el.closest && el.closest('button, a[href], input, select, textarea, label, [role="button"], [role="tab"], .blank')); }
zoomInBtn.addEventListener('click', function () { zoomStep(1); });
zoomOutBtn.addEventListener('click', function () { zoomStep(-1); });
zoomVal.addEventListener('click', function () { zoomTo(1); });

// 손가락 · 마우스 몸짓. 필기 처리(위)보다 나중에 등록되어, 필기가 먼저 판단한 뒤에 본다
stage.addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'pen') { VG.lastPen = performance.now(); return; }
  if (!inView(e.target)) return;
  if (e.pointerType === 'touch') {
    VG.touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const penBusy = (INK.active && INK.active.kind === 'pen') || performance.now() - VG.lastPen < 800;
    if (VG.touches.size === 2 && !penBusy) {
      if (INK.active) abortInk();               // 한 손가락으로 막 긋기 시작한 획은 버린다
      VG.drag = null; stage.classList.remove('panning');
      const ids = Array.from(VG.touches.keys()), a = VG.touches.get(ids[0]), b = VG.touches.get(ids[1]);
      const m = viewPt((a.x + b.x) / 2, (a.y + b.y) / 2);
      VG.pinch = { ids: ids, d0: Math.max(30, Math.hypot(a.x - b.x, a.y - b.y)), z0: ZT.z, cx: (m.x - ZT.x) / ZT.z, cy: (m.y - ZT.y) / ZT.z };
      ids.forEach(function (id) { try { stage.setPointerCapture(id); } catch (err) { /* 합성 이벤트 */ } });
      e.preventDefault(); e.stopPropagation();
      return;
    }
  }
  // 확대한 상태 : 빈 곳을 끌면 화면을 옮긴다 (단추 · 슬라이더 · 필기는 그대로)
  if (ZT.z > 1.001 && !VG.pinch && !INK.active && !isControl(e.target) && !wantsInk(e.pointerType, e.target) && (e.pointerType !== 'mouse' || e.button === 0)) {
    VG.drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, tx: ZT.x, ty: ZT.y, on: false, kind: e.pointerType };
  }
}, true);
stage.addEventListener('pointermove', function (e) {
  if (e.pointerType === 'pen') { VG.lastPen = performance.now(); return; }
  if (VG.touches.has(e.pointerId)) VG.touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const p = VG.pinch;
  if (p && p.ids.indexOf(e.pointerId) >= 0) {
    const a = VG.touches.get(p.ids[0]), b = VG.touches.get(p.ids[1]);
    if (!a || !b) return;
    const m = viewPt((a.x + b.x) / 2, (a.y + b.y) / 2);
    const z = clamp(p.z0 * Math.hypot(a.x - b.x, a.y - b.y) / p.d0, ZMIN, ZMAX);
    ZT.z = z; ZT.x = m.x - p.cx * z; ZT.y = m.y - p.cy * z;
    clampPan(); applyZoom();
    e.preventDefault(); e.stopPropagation();
    return;
  }
  const d = VG.drag;
  if (d && e.pointerId === d.id) {
    if (!d.on && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) > (d.kind === 'mouse' ? 4 : 12)) {
      d.on = true; stage.classList.add('panning');
      try { stage.setPointerCapture(d.id); } catch (err) { /* 합성 이벤트 */ }
    }
    if (d.on) {
      ZT.x = d.tx + (e.clientX - d.x0) / SCALE; ZT.y = d.ty + (e.clientY - d.y0) / SCALE;
      clampPan(); applyZoom();
      e.preventDefault();
    }
  }
}, true);
function vgEnd(e) {
  VG.touches.delete(e.pointerId);
  const p = VG.pinch;
  if (p && p.ids.indexOf(e.pointerId) >= 0) {
    VG.pinch = null;
    if (ZT.z < 1.06) { ZT.z = 1; ZT.x = 0; ZT.y = 0; applyZoom(); }   // 거의 원래 크기면 딱 맞춘다
    sharpenLater();
    VG.noClickUntil = performance.now() + 400;
  }
  const d = VG.drag;
  if (d && e.pointerId === d.id) {
    if (d.on) VG.noClickUntil = performance.now() + 400;
    VG.drag = null; stage.classList.remove('panning');
  }
}
// 손가락이 무대 밖에서 떨어져도 놓치지 않게 창 전체에서 받는다
window.addEventListener('pointerup', vgEnd, true);
window.addEventListener('pointercancel', vgEnd, true);
// 휠 : Ctrl(⌘) + 휠은 확대 · 축소(노트북 터치패드 오므리기 포함), 확대한 상태에서 그냥 휠은 옮기기
viewEl.addEventListener('wheel', function (e) {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const pt = viewPt(e.clientX, e.clientY);
    zoomTo(ZT.z * Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.004)), pt.x, pt.y);
  } else if (ZT.z > 1.001) {
    e.preventDefault();
    ZT.x -= e.deltaX / SCALE; ZT.y -= e.deltaY / SCALE;
    clampPan(); applyZoom();
  }
}, { passive: false });
// 아이패드 사파리 : 페이지 자체가 확대되지 않게 (확대는 위에서 직접 한다)
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });

/* ═══════════════ 시작 ═══════════════ */
try { const t = localStorage.getItem('thermo-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* 기본 테마 */ }
try { if (localStorage.getItem('thermo-pen-auto') === '0') INK.penAuto = false; } catch (e) { /* 기본 : 켬 */ }
readTheme(); themeLabel();
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const on = function () { readTheme(); themeLabel(); if (inkReady) redrawInk(); };
  if (mq.addEventListener) mq.addEventListener('change', on);
}
/* 전체 화면 : 브라우저가 허락할 때만 된다. 다른 웹페이지 안(예 : Claude 링크 화면)에 들어 있으면 브라우저가 막는다.
   그럴 때는 아무 일도 없는 것처럼 보이지 않게 안내를 띄운다. 아이패드 사파리는 16.4 부터 됨(그 전은 webkit 접두사) */
const fullBtn = document.getElementById('btn-full');
let toastTimer = 0;
function toast(html, ms) {
  const t = document.getElementById('toast');
  t.innerHTML = html; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, ms || 6000);
}
document.getElementById('toast').addEventListener('click', function () { this.hidden = true; });
function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
function fsHelp() {
  const framed = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  toast(framed
    ? '<b>이 창에서는 전체 화면을 쓸 수 없습니다.</b><br>다른 웹페이지(Claude 링크 화면) 안에 들어 있으면 브라우저가 막습니다.<br>· 받은 HTML 파일을 크롬 · 엣지 · 웨일로 직접 열면 이 단추로 전체 화면이 됩니다.<br>· 전자칠판 PC 는 키보드 <b>F11</b> 로 브라우저 전체를 키울 수 있습니다.'
    : '<b>이 브라우저에서는 전체 화면을 쓸 수 없습니다.</b><br>전자칠판 PC 는 키보드 <b>F11</b>, 아이패드는 사파리(iPadOS 16.4 이상)에서 열어 보세요.', 9000);
}
function syncFull() {
  const on = !!fsElement();
  fullBtn.setAttribute('aria-pressed', String(on));
  fullBtn.setAttribute('aria-label', on ? '전체 화면 끝내기' : '전체 화면');
  fullBtn.title = on ? '전체 화면 끝내기 (F 키)' : '전체 화면 (F 키)';
}
function toggleFull() {
  const d = document, el = d.documentElement;
  if (fsElement()) {
    const ex = d.exitFullscreen || d.webkitExitFullscreen;
    try { const r = ex && ex.call(d); if (r && r.catch) r.catch(function () { /* 이미 나옴 */ }); } catch (e) { /* 무시 */ }
    return;
  }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const enabled = d.fullscreenEnabled !== undefined ? d.fullscreenEnabled : d.webkitFullscreenEnabled;
  if (!req || enabled === false) { fsHelp(); return; }
  let failed = false;
  const fail = function () { if (!failed) { failed = true; fsHelp(); } };
  const seen = FS_CHANGES;
  try {
    const r = req.call(el);
    if (r && r.catch) r.catch(fail);
  } catch (e) { fail(); return; }
  // 약속(promise)을 돌려주지 않는 옛 사파리 : 한참 뒤에도 바뀐 적이 없고 전체 화면도 아니면 안내
  setTimeout(function () { if (!fsElement() && FS_CHANGES === seen) fail(); }, 1500);
}
let FS_CHANGES = 0;
['fullscreenchange', 'webkitfullscreenchange'].forEach(function (t) { document.addEventListener(t, function () { FS_CHANGES++; syncFull(); fit(); }); });
document.getElementById('btn-home').addEventListener('click', function () { go(0); });
document.getElementById('btn-prev').addEventListener('click', function () { go(idx - 1); });
document.getElementById('btn-next').addEventListener('click', function () { go(idx + 1); });
document.getElementById('btn-full').addEventListener('click', toggleFull);
document.addEventListener('keydown', function (ev) {
  const t = ev.target;
  const inRange = !!(t && t.tagName === 'INPUT');
  if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'z' || ev.key === 'Z')) { ev.preventDefault(); undoInk(); return; }
  if (ev.key === 'PageDown' || (!inRange && ev.key === 'ArrowRight')) { ev.preventDefault(); go(idx + 1); }
  else if (ev.key === 'PageUp' || (!inRange && ev.key === 'ArrowLeft')) { ev.preventDefault(); go(idx - 1); }
  else if (ev.key === 'Home' && !inRange) { go(0); }
  else if (ev.key === 'End' && !inRange) { go(SCENES.length - 1); }
  else if ((ev.key === 'f' || ev.key === 'F') && !inRange && !ev.ctrlKey && !ev.metaKey && !ev.altKey) { toggleFull(); }
  // 확대 · 축소 : + − 0 (Ctrl 과 함께 누르면 브라우저 자체 확대이므로 건드리지 않는다)
  else if (!inRange && !ev.ctrlKey && !ev.metaKey && !ev.altKey && (ev.key === '+' || ev.key === '=')) { ev.preventDefault(); zoomStep(1); }
  else if (!inRange && !ev.ctrlKey && !ev.metaKey && !ev.altKey && (ev.key === '-' || ev.key === '_')) { ev.preventDefault(); zoomStep(-1); }
  else if (!inRange && !ev.ctrlKey && !ev.metaKey && !ev.altKey && ev.key === '0') { ev.preventDefault(); zoomTo(1); }
});
window.addEventListener('resize', fit);
fit();
applyZoom(); syncFull();
let start = 0;
try { const hs = (location.hash || '').replace('#', ''); SCENES.forEach(function (s, i) { if (s.id === hs) start = i; }); } catch (e) { /* 처음부터 */ }
go(start);
loadInk();
syncTools();
INK.key = pageKey();
inkReady = true;
redrawInk();
requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fit(); });
</script>

</body>
</html>
