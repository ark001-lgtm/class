<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 수업</title>
<meta name="description" content="소단원마다 만든 전자칠판·아이패드 수업 화면과 시뮬레이션 모음">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1217" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나의 수업">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/*@@HUB_CSS@@*/
</style>
</head>
<body>
<div class="wrap">
  <nav class="appbar" aria-label="상단">
    <a class="brand" href="./" aria-label="나의 수업 처음 화면"><img src="icons/icon.svg" alt="" width="30" height="30"><span>나의 수업</span><small id="year-label"></small></a>
    <span class="spacer"></span>
    <select id="year" class="btn" aria-label="학년도 고르기" hidden></select>
    <button id="btn-theme" class="btn" type="button">어두운 화면</button>
  </nav>

  <section class="intro">
    <h1>오늘 수업, 어디부터 열까요?</h1>
    <p id="curr"></p>
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="소단원·개념 검색 (예: 포물선, 열역학)" autocomplete="off" enterkeyhint="search" aria-label="소단원 찾기">
    </label>
  </section>

  <div class="bar"><div class="seg" role="group" aria-label="과목" id="subjects"></div></div>
  <div id="notice"></div>
  <p class="status" id="status" aria-live="polite"></p>
  <main class="units" id="units"></main>
  <footer class="site" id="foot"></footer>
</div>

<dialog id="memo" aria-labelledby="memo-title">
  <div class="memo-head">
    <div><small id="memo-kicker"></small><h2 id="memo-title"></h2></div>
    <button class="btn" type="button" id="memo-close">닫기</button>
  </div>
  <div class="memo-body" id="memo-body"></div>
</dialog>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <div class="memo-head">
    <div><small id="sheet-kicker"></small><h2 id="sheet-title"></h2></div>
    <div class="sheet-tools"><button class="btn" type="button" id="sheet-close">닫기</button></div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</dialog>
<div id="update" role="status" hidden>새로 고친 수업 내용이 있습니다. <button class="btn" type="button" id="update-go">새로 고침</button></div>
<div id="toast" role="status" hidden></div>
<script id="hub-data" type="application/json">@@HUB_DATA@@</script>
<script>
/*@@HUB_JS@@*/
</script>
</body>
</html>
