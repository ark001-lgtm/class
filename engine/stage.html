<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@@TITLE@@</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
@@ENGINE_CSS@@
@@LESSON_CSS@@
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <header class="bar">
      <div class="bar-left">
        <a class="btn" id="btn-hub" href="#" title="수업 목록으로" style="text-decoration:none" hidden>← 목록</a>
        <div class="titles">
          <div class="kicker"><span id="kicker">@@KICKER@@</span><span class="ws-chip" id="ws-chip" hidden></span></div>
          <h1 id="scene-title">수업 화면</h1>
        </div>
      </div>
      <div class="pen-tools" role="toolbar" aria-label="필기 도구">
        <button class="tool toggle" id="tool-hand" type="button" aria-pressed="false" title="켜면 손가락·마우스로도 씁니다. 애플 펜슬은 늘 바로 써집니다.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4.5-1L19 8.5a2.1 2.1 0 0 0-3-3L5.5 16 4 20z"/><path d="M14.5 7l2.5 2.5"/></svg><span>손 필기</span></button>
        <button class="tool pick sw" type="button" data-tool="pen" data-color="pen" aria-pressed="true" aria-label="빨간 펜" title="빨간 펜"><i style="background:var(--pen)"></i></button>
        <button class="tool pick sw" type="button" data-tool="pen" data-color="cold" aria-pressed="false" aria-label="파란 펜" title="파란 펜"><i style="background:var(--cold)"></i></button>
        <button class="tool pick sw" type="button" data-tool="pen" data-color="ink" aria-pressed="false" aria-label="검은 펜" title="검은 펜 (어두운 화면에서는 흰 펜)"><i style="background:var(--ink)"></i></button>
        <button class="tool pick sw hl" type="button" data-tool="hl" aria-pressed="false" aria-label="형광펜" title="형광펜"><i style="background:#FFD60A"></i></button>
        <button class="tool pick" type="button" data-tool="eraser" aria-pressed="false" aria-label="지우개" title="지우개 : 지나간 획을 통째로 지웁니다">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 19.5l-4-4a1.6 1.6 0 0 1 0-2.3l8.3-8.3a1.6 1.6 0 0 1 2.3 0l4.6 4.6a1.6 1.6 0 0 1 0 2.3L13 19.5z"/><path d="M8.5 19.5H20"/><path d="M9 9l6.5 6.5"/></svg></button>
        <button class="tool" id="tool-undo" type="button" aria-label="되돌리기" title="되돌리기 (Ctrl+Z)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="tool" id="tool-clear" type="button" aria-label="이 화면 필기 지우기" title="이 화면의 필기를 모두 지웁니다 (되돌리기로 살릴 수 있음)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5M14 11v5.5"/></svg></button>
        <button class="tool toggle" id="tool-board" type="button" aria-pressed="false" aria-label="빈 판서" title="빈 판서 : 수업 화면을 가리고 빈 모눈 판에 씁니다">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/><path d="M7 12l3-3 2 2 4-4"/></svg></button>
      </div>
      <div class="bar-right">
        <span class="count" id="count"></span>
        <button class="btn" id="btn-prev" type="button">이전</button>
        <button class="btn primary" id="btn-next" type="button">다음</button>
        <div class="view-tools" role="toolbar" aria-label="화면 크기">
          <button class="tool" id="zoom-out" type="button" aria-label="축소" title="축소 (− 키)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20.5 20.5"/><path d="M7.5 10.5h6"/></svg></button>
          <button class="tool zoom-val" id="zoom-reset" type="button" aria-label="원래 크기로" title="누르면 원래 크기 (0 키)">100%</button>
          <button class="tool" id="zoom-in" type="button" aria-label="확대" title="확대 (+ 키) · 두 손가락으로 벌려도 됩니다">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20.5 20.5"/><path d="M7.5 10.5h6M10.5 7.5v6"/></svg></button>
          <button class="tool" id="btn-full" type="button" aria-label="전체 화면" title="전체 화면 (F 키)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="fs-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="fs-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
        </div>
      </div>
    </header>
    <div id="view">
      <div id="zoom">
        <main id="scene"></main>
        <div id="ink-wrap"><div id="board" hidden><span class="board-note">빈 판서 · 위의 [빈 판서] 단추를 다시 누르면 수업 화면으로 돌아갑니다</span></div></div>
      </div>
    </div>
    <div id="toast" role="status" hidden></div>
  </div>
</div>
<div id="rotate-hint" role="status" hidden>아이패드를 가로로 돌리면 수업 화면이 크게 보입니다 · 눌러서 닫기</div>

<script>
@@SCRIPT@@
</script>
</body>
</html>
